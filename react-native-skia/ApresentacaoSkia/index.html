      -webkit-backdrop-filter: blur(20px);

      backdrop-filter: blur(20px);

      box-shadow: 0 12px 36px rgba(14, 165, 233, 0.08), inset 0 1px 0 rgba(255, 255, 255, 0.9);

    @keyframes floatSlow {

      0%,
      100% {
        transform: translate(0px, 0px) scale(1);
      }

      50% {
        transform: translate(14px, -18px) scale(1.04);
      }
    }

    .aurora-blob {
      animation: floatSlow 12s ease-in-out infinite;
    }

    @keyframes slideEnter {
      from {
        opacity: 0;
        transform: translateY(12px) scale(0.99);
      }

      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    .slide-enter {
      animation: slideEnter 0.32s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    @keyframes phoneVibrate {

      0%,
      100% {
        transform: translate(0, 0) rotate(0deg);
      }

      15% {
        transform: translate(-3px, 1px) rotate(-0.8deg);
      }

      30% {
        transform: translate(3px, -1px) rotate(0.8deg);
      }

      45% {
        transform: translate(-3px, -1px) rotate(-0.6deg);
      }

      60% {
        transform: translate(3px, 1px) rotate(0.6deg);
      }

      75% {
        transform: translate(-2px, 1px) rotate(-0.4deg);
      }

      90% {
        transform: translate(2px, -1px) rotate(0.4deg);

    // --- Code Block (Crisp Dark Editor Contrast on Pastel Background) ---
    const CodeBlock = ({ code, title = "App.tsx", lang = "tsx" }) => {
      const [copied, setCopied] = useState(false);

      const handleCopy = (e) => {
        e.stopPropagation();
        navigator.clipboard?.writeText(code.trim());
        setCopied(true);
        setTimeout(() => setCopied(false), 1800);
      };

      const highlightLine = (line) => {
        if (lang === "bash") {
          return line.split(/(\s+)/).map((part, i) => {
            if (/^(npx|expo|install|run:ios|run:android|start)$/.test(part)) {
              return <span key={i} className="text-pastel-cyan font-semibold">{part}</span>;
            }
            if (part.startsWith("@") || part.startsWith("--")) {
              return <span key={i} className="text-pastel-mint">{part}</span>;
            }
            if (part.startsWith("#")) {
              return <span key={i} className="text-slate-400 italic">{part}</span>;
            }
            return <span key={i} className="text-slate-100">{part}</span>;
          });
        }

        const tokenRegex = /(\/\/.*$|'(?:\\.|[^'])*'|"(?:\\.|[^"])*"|\b(?:import|from|export|default|const|return|function|require|if)\b|<\/?[A-Za-z0-9_]+|\/>|>|\b(?:useFont|useSharedValue|withRepeat|withTiming|useEffect|Canvas|Circle|Group|BackdropBlur|Blur|Shadow|BlurMask|Shader|Path|Points|LinearGradient|Text|Fill|RoundedRect|GestureDetector|CartesianChart|Line)\b|\b\d+(?:\.\d+)?\b)/g;
        const parts = [];
        let lastIndex = 0;
        let match;

        while ((match = tokenRegex.exec(line)) !== null) {
          if (match.index > lastIndex) {
            parts.push(<span key={`t-${lastIndex}`} className="text-slate-100">{line.slice(lastIndex, match.index)}</span>);
          }
          const token = match[0];
          let cls = "text-slate-100";
          if (token.startsWith("//")) cls = "text-slate-400 italic";
          else if (token.startsWith("'") || token.startsWith('"')) cls = "text-pastel-mint";
          else if (/^(import|from|export|default|const|return|function|require|if)$/.test(token)) cls = "text-pastel-lavender font-medium";
          else if (token.startsWith("<") || token === "/>" || token === ">") cls = "text-pastel-cyan font-semibold";
          else if (/^(useFont|useSharedValue|withRepeat|withTiming|useEffect|Canvas|Circle|Group|BackdropBlur|Blur|Shadow|BlurMask|Shader|Path|Points|LinearGradient|Text|Fill|RoundedRect|GestureDetector|CartesianChart|Line)$/.test(token)) cls = "text-pastel-butter";
          else if (/^\d/.test(token)) cls = "text-pastel-peach";

          parts.push(<span key={`m-${match.index}`} className={cls}>{token}</span>);
          lastIndex = tokenRegex.lastIndex;
        }
        if (lastIndex < line.length) {
          parts.push(<span key={`e-${lastIndex}`} className="text-slate-100">{line.slice(lastIndex)}</span>);
        }
        return parts;
      };

      const lines = code.trim().split("\n");

      return (

    // --- Interactive Cover Background Particles (Pastel on Light) ---
    const CoverCanvas = () => {
      const ref = useRef(null);
      useEffect(() => {
        const canvas = ref.current;
        if (!canvas) return;
        const ctx = canvas.getContext("2d");
        const colors = ["#38bdf8", "#34d399", "#a78bfa", "#fb7185"];
        const pts = Array.from({ length: 42 }, (_, i) => ({
          x: Math.random() * canvas.width,
          y: Math.random() * canvas.height,
          vx: (Math.random() - 0.5) * 0.65,
          vy: (Math.random() - 0.5) * 0.65,
          r: Math.random() * 2.6 + 1.4,
          c: colors[i % colors.length],
        }));

        let id;
        const draw = () => {
          id = requestAnimationFrame(draw);
          ctx.clearRect(0, 0, canvas.width, canvas.height);
          for (let i = 0; i < pts.length; i++) {
            const p = pts[i];
            p.x += p.vx;
            p.y += p.vy;
            if (p.x < 0 || p.x > canvas.width) p.vx *= -1;
            if (p.y < 0 || p.y > canvas.height) p.vy *= -1;

            ctx.beginPath();
            ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
            ctx.fillStyle = p.c;
            ctx.fill();

            for (let j = i + 1; j < pts.length; j++) {
              const q = pts[j];
              const dist = Math.hypot(p.x - q.x, p.y - q.y);
              if (dist < 115) {
                ctx.beginPath();
                ctx.moveTo(p.x, p.y);
                ctx.lineTo(q.x, q.y);
                ctx.strokeStyle = `rgba(139, 92, 246, ${(1 - dist / 115) * 0.22})`;
                ctx.lineWidth = 1;
                ctx.stroke();
              }
            }
          }
        };
        id = requestAnimationFrame(draw);
        return () => cancelAnimationFrame(id);
      }, []);

      return <canvas ref={ref} width={900} height={500} className="absolute inset-0 w-full h-full opacity-70 pointer-events-none" />;
    };

    // --- Slide 2 Interactive Comparison ---
    const Slide2Interactive = () => {
      const [tab, setTab] = useState("skia");
      return (
        <div className="grid grid-cols-1 lg:grid-cols-2 gap-8 items-center h-full">
          <div className="space-y-5">
            <div className="glass-pastel-mint rounded-2xl p-6 border-l-4 border-l-emerald-400">
              <div className="flex items-center gap-3 mb-2">
                <Icon name="check" className="w-6 h-6 text-emerald-600" />
                <h3 className="text-2xl font-bold text-slate-900">Resolve 90% do app</h3>
              </div>
              <p className="text-lg text-slate-700 leading-relaxed">
                Botões, listas, formulários e layouts Flexbox funcionam perfeitamente com <code className="text-sky-700 bg-sky-100 px-1.5 py-0.5 rounded font-mono text-base">&lt;View&gt;</code>, <code className="text-sky-700 bg-sky-100 px-1.5 py-0.5 rounded font-mono text-base">&lt;Text&gt;</code> e <code className="text-sky-700 bg-sky-100 px-1.5 py-0.5 rounded font-mono text-base">&lt;Image&gt;</code>.
              </p>
            </div>

            <div className="glass-pastel rounded-2xl p-6 border-l-4 border-l-rose-400">
              <div className="flex items-center gap-3 mb-3">
                <Icon name="alert" className="w-6 h-6 text-rose-500" />
                <h3 className="text-2xl font-bold text-slate-900">Onde a UI tradicional trava</h3>
              </div>
              <ul className="space-y-3 text-lg text-slate-700">
                <li className="flex items-start gap-3">
                  <span className="text-rose-500 font-bold mt-0.5">•</span>
                  <span>Não tem <strong className="text-slate-900">vidro fosco real</strong>, sombras internas ou shaders.</span>
                </li>
                <li className="flex items-start gap-3">
                  <span className="text-rose-500 font-bold mt-0.5">•</span>
                  <span><strong className="text-slate-900">Engasga a CPU</strong> ao animar centenas de elementos simultâneos.</span>
                </li>
              </ul>
            </div>

    // --- Slide 7 Interactive CPU vs GPU Mini-Simulator ---
    const CpuGpuSimulator = () => {
      const [mode, setMode] = useState("gpu");
      const [fps, setFps] = useState(60);
      const canvasRef = useRef(null);
      const modeRef = useRef(mode);

      useEffect(() => {
        modeRef.current = mode;
        setFps(mode === "gpu" ? 60 : 22);
      }, [mode]);

      useEffect(() => {
        const canvas = canvasRef.current;
        if (!canvas) return;
        const ctx = canvas.getContext("2d");

        const palette = ["#7dd3fc", "#86efac", "#c4b5fd", "#fda4af"];
        const particles = Array.from({ length: 115 }, (_, i) => ({
          x: Math.random() * canvas.width,
          y: Math.random() * canvas.height,
          vx: (Math.random() - 0.5) * 3.4,
          vy: (Math.random() - 0.5) * 3.4,
          r: Math.random() * 4 + 2.2,
          color: palette[i % palette.length],
        }));

        let animId;
        let lastDraw = performance.now();
        let frameCount = 0;
        let fpsTimer = performance.now();

        const render = (now) => {
          animId = requestAnimationFrame(render);
          const isCpu = modeRef.current === "cpu";
          const targetInterval = isCpu ? 45 + (Math.sin(now * 0.01) > 0.7 ? 20 : 0) : 0;

          if (isCpu && now - lastDraw < targetInterval) return;

          const dt = Math.min((now - lastDraw) / 16.67, 3);
          lastDraw = now;

          frameCount++;
          if (now - fpsTimer >= 350) {
            const measured = Math.round((frameCount * 1000) / (now - fpsTimer));
            setFps(isCpu ? Math.min(24, Math.max(19, measured)) : Math.min(60, Math.max(58, measured)));
            frameCount = 0;
            fpsTimer = now;
          }

          ctx.fillStyle = "rgba(19, 26, 43, 0.32)";
          ctx.fillRect(0, 0, canvas.width, canvas.height);

          for (const p of particles) {
            p.x += p.vx * (isCpu ? 1.15 : dt);
            p.y += p.vy * (isCpu ? 1.15 : dt);
            if (p.x < 0 || p.x > canvas.width) p.vx *= -1;
            if (p.y < 0 || p.y > canvas.height) p.vy *= -1;

            ctx.beginPath();
            ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
            ctx.fillStyle = p.color;
            ctx.shadowBlur = isCpu ? 0 : 12;
            ctx.shadowColor = p.color;
            ctx.fill();
          }

          ctx.shadowBlur = 0;
          const cardW = Math.min(canvas.width * 0.52, 460);
          const cardH = 88;
          const cardX = (canvas.width - cardW) / 2;
          const cardY = (canvas.height - cardH) / 2;

          ctx.fillStyle = isCpu ? "rgba(30, 41, 59, 0.88)" : "rgba(19, 26, 43, 0.58)";
          ctx.strokeStyle = isCpu ? "rgba(253, 164, 175, 0.65)" : "rgba(125, 211, 252, 0.55)";
          ctx.lineWidth = 2;
          ctx.beginPath();
          ctx.roundRect(cardX, cardY, cardW, cardH, 16);
          ctx.fill();
          ctx.stroke();

          ctx.fillStyle = "#f1f5f9";
          ctx.font = "700 18px 'Plus Jakarta Sans', sans-serif";
          ctx.textAlign = "center";
          ctx.fillText(
            isCpu ? "Views JS Thread (Gargalo)" : "Skia Canvas (BackdropBlur + GPU)",
            canvas.width / 2,
            cardY + 36
          );
          ctx.fillStyle = isCpu ? "#fda4af" : "#86efac";
          ctx.font = "700 14px 'JetBrains Mono', monospace";
          ctx.fillText(
            isCpu ? "Frame time: ~45ms • Travando" : "Frame time: 16.6ms • Liso",
            canvas.width / 2,
            cardY + 62
          );
        };

        animId = requestAnimationFrame(render);
        return () => cancelAnimationFrame(animId);
      }, []);

      const isGpu = mode === "gpu";

      return (
        <div onClick={(e) => e.stopPropagation()} className="glass-pastel rounded-2xl p-4 flex flex-col gap-3 h-full justify-between">
          <div className="flex items-center justify-between gap-2">
            <div>
              <span className="text-xs font-mono uppercase tracking-wider text-sky-700 font-semibold">Mini-Simulador ao Vivo</span>
              <h3 className="text-lg font-bold text-slate-900">115 Partículas + Blur</h3>
            </div>
            <div
              className={`px-3 py-1.5 rounded-xl font-mono font-extrabold text-lg border flex items-center gap-2 transition-colors ${isGpu
                ? "bg-emerald-100 border-emerald-300 text-emerald-800"
                : "bg-rose-100 border-rose-300 text-rose-700"
                }`}
            >
              <span className={`w-2.5 h-2.5 rounded-full ${isGpu ? "bg-emerald-500 animate-pulse" : "bg-rose-500"}`}></span>
              {fps} FPS
            </div>
          </div>

          <div className="relative rounded-xl overflow-hidden border border-indigo-200 bg-[#131a2b] flex-1 min-h-[340px] flex items-center justify-center">
            <canvas ref={canvasRef} width={960} height={420} className="w-full h-full object-contain" />
          </div>

          <button
            type="button"
            onClick={(e) => {
              e.stopPropagation();
              setMode((prev) => (prev === "gpu" ? "cpu" : "gpu"));
            }}
            className={`w-full py-3 px-4 rounded-xl font-semibold text-sm md:text-base transition-all cursor-pointer flex items-center justify-center gap-2 border ${isGpu
              ? "bg-gradient-to-r from-sky-100 via-violet-100 to-emerald-100 border-sky-300 text-slate-900 hover:brightness-95"
              : "bg-rose-100 border-rose-300 text-rose-800 hover:bg-rose-200"
              }`}
          >
            <Icon name="zap" className="w-5 h-5" />
            Alternar: CPU (Views) vs GPU (Skia)

    // --- Gráfico em Tempo Real (Victory Native XL + Skia) ---
    const VictoryLiveChart = ({ lineWidth = 2.5 }) => {
      const [engine, setEngine] = useState("skia"); // "skia" | "svg"
      const [selectedInfo, setSelectedInfo] = useState({ val: 104.2, label: "Agora" });
      const canvasRef = useRef(null);
      const engineRef = useRef(engine);
      const lineWidthRef = useRef(lineWidth);
      const hoverXRef = useRef(0.68);

      useEffect(() => {
        engineRef.current = engine;
      }, [engine]);

      useEffect(() => {
        lineWidthRef.current = lineWidth;
      }, [lineWidth]);

      useEffect(() => {
        const canvas = canvasRef.current;
        if (!canvas) return;
        const ctx = canvas.getContext("2d");

        let phase = 0;
        let lastDraw = performance.now();
        let lastShownText = "";
        let id;

        const samplePoint = (xNorm, t) =>
          68 +
          Math.sin(xNorm * 8.5 - t) * 14 +
          Math.cos(xNorm * 4.2 - t * 0.65) * 8 +
          Math.sin(xNorm * 14 - t * 1.3) * 3;

        const render = (now) => {
          id = requestAnimationFrame(render);
          const isSvg = engineRef.current === "svg";
          // Sem Skia (SVG/JS Bridge): trava a ~8 FPS ao interagir
          if (isSvg && now - lastDraw < 130) return;

          const dt = Math.min((now - lastDraw) / 1000, 0.15);
          lastDraw = now;
          phase += dt * (isSvg ? 1.5 : 6.5);

          const count = 48;
          const pts = Array.from({ length: count }, (_, i) => samplePoint(i / (count - 1), phase));

          const w = canvas.width;
          const h = canvas.height;
          ctx.clearRect(0, 0, w, h);

          // Grid sutil
          ctx.strokeStyle = "rgba(148, 163, 184, 0.12)";
          ctx.lineWidth = 1;
          for (let y = 24; y < h; y += 28) {
            ctx.beginPath();
            ctx.moveTo(0, y);
            ctx.lineTo(w, y);
            ctx.stroke();
          }

          const mapX = (i) => (i / (pts.length - 1)) * (w - 20) + 10;
          const mapY = (v) => h - 18 - ((v - 30) / 80) * (h - 36);

          const traceSmoothCurve = () => {
            ctx.moveTo(mapX(0), mapY(pts[0]));
            for (let i = 0; i < pts.length - 1; i++) {
              const x0 = mapX(i);
              const y0 = mapY(pts[i]);
              const x1 = mapX(i + 1);
              const y1 = mapY(pts[i + 1]);
              if (isSvg) {
                ctx.lineTo(x1, y1);
              } else {
                const mx = (x0 + x1) / 2;
                const my = (y0 + y1) / 2;
                ctx.quadraticCurveTo(x0, y0, mx, my);
              }
            }
            ctx.lineTo(mapX(pts.length - 1), mapY(pts[pts.length - 1]));
          };

          // Área preenchida com gradiente pastel
          const areaGrad = ctx.createLinearGradient(0, 10, 0, h);
          areaGrad.addColorStop(0, isSvg ? "rgba(253, 164, 175, 0.32)" : "rgba(134, 239, 172, 0.35)");
          areaGrad.addColorStop(1, "rgba(19, 26, 43, 0)");

          ctx.beginPath();
          traceSmoothCurve();
          ctx.lineTo(mapX(pts.length - 1), h);
          ctx.lineTo(mapX(0), h);
          ctx.closePath();
          ctx.fillStyle = areaGrad;
          ctx.fill();

          // Linha principal
          ctx.beginPath();
          traceSmoothCurve();
          ctx.strokeStyle = isSvg ? "#fda4af" : "#86efac";
          ctx.lineWidth = lineWidthRef.current;
          ctx.stroke();

          // Crosshair interativo suave ao passar o mouse
          const hoverNorm = Math.max(0, Math.min(1, hoverXRef.current));
          const hx = hoverNorm * (w - 20) + 10;
          const hoverVal = samplePoint(hoverNorm, phase);
          const hy = mapY(hoverVal);
          const idx = Math.max(0, Math.min(pts.length - 1, Math.round(hoverNorm * (pts.length - 1))));

          ctx.strokeStyle = "rgba(125, 211, 252, 0.55)";
          ctx.setLineDash([3, 3]);
          ctx.lineWidth = 1.2;
          ctx.beginPath();
          ctx.moveTo(hx, 8);
          ctx.lineTo(hx, h - 8);
          ctx.stroke();
          ctx.setLineDash([]);

          ctx.beginPath();
          ctx.arc(hx, hy, 5, 0, Math.PI * 2);
          ctx.fillStyle = "#7dd3fc";
          ctx.fill();
          ctx.strokeStyle = "#ffffff";
          ctx.lineWidth = 1.5;
          ctx.stroke();

          const nextText = `${(pts[idx] + 35).toFixed(1)}-${idx}`;
          if (nextText !== lastShownText) {
            lastShownText = nextText;
            setSelectedInfo({
              val: (pts[idx] + 35).toFixed(1),
              label: `Ponto #${idx + 1}`,
            });
          }
        };

        id = requestAnimationFrame(render);
        return () => cancelAnimationFrame(id);
      }, []);

      const handlePointer = (e) => {
        const rect = e.currentTarget.getBoundingClientRect();
        hoverXRef.current = Math.max(0, Math.min(1, (e.clientX - rect.left) / rect.width));
      };

      const isSkia = engine === "skia";

      return (
        <div className="space-y-2">
          <div className="flex flex-wrap items-center justify-between gap-2">
            <div className="flex items-center gap-2">
              <span className="px-2.5 py-0.5 rounded-md bg-slate-800 text-pastel-cyan font-mono text-xs font-bold">

          >
            <canvas ref={canvasRef} width={520} height={112} className="w-full h-full" />
          </div>
        </div>
      );
    };

    const AiOrbCanvas = ({ strokeWidth = 0.8, waveIntensity = 5 }) => {
      const ref = useRef(null);
      const paramsRef = useRef({ strokeWidth, waveIntensity });

      useEffect(() => {
        paramsRef.current = { strokeWidth, waveIntensity };
      }, [strokeWidth, waveIntensity]);

      useEffect(() => {
        const canvas = ref.current;
        if (!canvas) return;
        const ctx = canvas.getContext("2d");
        let t = 0;
        let id;

        // Partículas externas cintilantes ao redor da orbe
        const haloPts = Array.from({ length: 90 }, (_, i) => {
          const a = (i / 90) * Math.PI * 2 + Math.random() * 0.25;
          const dist = 48 + Math.random() * 14;
          return { a, dist, r: Math.random() * 1.25 + 0.6, phase: Math.random() * 6.28 };
        });

        const draw = () => {
          id = requestAnimationFrame(draw);
          t += 0.025;
          ctx.clearRect(0, 0, canvas.width, canvas.height);

          const cx = canvas.width / 2;
          const cy = canvas.height / 2;

          // Brilho de fundo azul-ciano (topo esq) -> violeta/magenta (base dir)
          const glow = ctx.createLinearGradient(cx - 50, cy - 50, cx + 50, cy + 50);
          glow.addColorStop(0, "rgba(56, 189, 248, 0.30)");
          glow.addColorStop(0.5, "rgba(167, 139, 250, 0.22)");
          glow.addColorStop(1, "rgba(232, 121, 249, 0.30)");
          ctx.fillStyle = glow;
          ctx.beginPath();
          ctx.arc(cx, cy, 58, 0, Math.PI * 2);
          ctx.fill();

          // Partículas externas cintilantes
          for (const hp of haloPts) {
            const pulse = 0.35 + 0.65 * Math.sin(t * 2 + hp.phase);
            const px = cx + Math.cos(hp.a + t * 0.08) * hp.dist;
            const py = cy + Math.sin(hp.a + t * 0.08) * hp.dist;
            ctx.fillStyle = px < cx
              ? `rgba(125, 211, 252, ${pulse * 0.8})`
              : `rgba(232, 121, 249, ${pulse * 0.8})`;
            ctx.beginPath();
            ctx.arc(px, py, hp.r, 0, Math.PI * 2);
            ctx.fill();
          }

          // Malha 3D -> 2D ondulada (Wireframe Mesh Orb)
          const latSteps = 16;
          const lonSteps = 26;
          const baseR = 40;
          const grid = [];

          for (let i = 0; i <= latSteps; i++) {
            const phi = (i / latSteps) * Math.PI;
            const row = [];
            for (let j = 0; j <= lonSteps; j++) {
              const theta = (j / lonSteps) * Math.PI * 2 + t * 0.35;
              const { strokeWidth: sw, waveIntensity: wi } = paramsRef.current;
              const disp =
                Math.sin(phi * 4 + t * 2.1) * Math.cos(theta * 3 - t * 1.4) * wi +
                Math.cos(phi * 6 - t * 1.6) * Math.sin(theta * 5 + t * 1.8) * (wi * 0.55);
              const r = baseR + disp;

              const x3 = r * Math.sin(phi) * Math.cos(theta);
              const y3 = r * Math.cos(phi);
              const z3 = r * Math.sin(phi) * Math.sin(theta);

              const rotY = y3 * Math.cos(0.35) - z3 * Math.sin(0.35);
              const rotZ = y3 * Math.sin(0.35) + z3 * Math.cos(0.35);

              row.push({ x: cx + x3, y: cy + rotY, z: rotZ });
            }
            grid.push(row);
          }

          const strokeGrad = ctx.createLinearGradient(cx - 46, cy - 46, cx + 46, cy + 46);
          strokeGrad.addColorStop(0, "rgba(125, 211, 252, 0.88)");
          strokeGrad.addColorStop(0.5, "rgba(167, 139, 250, 0.75)");
          strokeGrad.addColorStop(1, "rgba(244, 114, 182, 0.90)");

          ctx.strokeStyle = strokeGrad;
          ctx.lineWidth = paramsRef.current.strokeWidth;

          for (let i = 0; i <= latSteps; i++) {
            ctx.beginPath();
            for (let j = 0; j <= lonSteps; j++) {
              const pt = grid[i][j];
              if (j === 0) ctx.moveTo(pt.x, pt.y);
              else ctx.lineTo(pt.x, pt.y);
            }
            ctx.stroke();
          }

          for (let j = 0; j < lonSteps; j++) {
            ctx.beginPath();
            for (let i = 0; i <= latSteps; i++) {
              const pt = grid[i][j];
              if (i === 0) ctx.moveTo(pt.x, pt.y);
              else ctx.lineTo(pt.x, pt.y);
            }
            ctx.stroke();
          }

          // Pontinhos brilhantes nos vértices frontais
          for (let i = 1; i < latSteps; i += 2) {
            for (let j = 0; j < lonSteps; j += 2) {
              const pt = grid[i][j];
              if (pt.z > 4) {
                ctx.fillStyle = pt.x < cx ? "rgba(186, 230, 253, 0.92)" : "rgba(245, 208, 254, 0.92)";
                ctx.beginPath();
                ctx.arc(pt.x, pt.y, 1.05, 0, Math.PI * 2);
                ctx.fill();
              }
            }
          }
        };

        id = requestAnimationFrame(draw);
        return () => cancelAnimationFrame(id);
      }, []);
      return <canvas ref={ref} width={220} height={134} className="w-52 h-32" />;
    };

    const SlideCanvasHitTestInteractive = () => {

      const [hits, setHits] = useState(0);

      const btn = { x: 90, y: 45, width: 180, height: 54 };

      const handleCanvasTap = (e) => {
        e.stopPropagation();
        const rect = e.currentTarget.getBoundingClientRect();
        const x = Math.round(((e.clientX - rect.left) / rect.width) * 360);
        const y = Math.round(((e.clientY - rect.top) / rect.height) * 144);
        const hit =
          x >= btn.x &&
          x <= btn.x + btn.width &&
          y >= btn.y &&
          y <= btn.y + btn.height;

        setLastTap({ x, y, hit });
        if (hit) setHits((c) => c + 1);
      };

      const hitTestCode = `const btn = { x: 90, y: 45, width: 180, height: 54 };

  const hit = e.x >= btn.x && e.x <= btn.x + btn.width

    // --- Main App ---
    function App() {
      const [current, setCurrent] = useState(0);
      const [showMap, setShowMap] = useState(false);
      const total = SLIDES.length;

      const nextSlide = useCallback(() => setCurrent((p) => Math.min(p + 1, total - 1)), [total]);
      const prevSlide = useCallback(() => setCurrent((p) => Math.max(p - 1, 0)), []);

      const toggleFullscreen = useCallback((e) => {
        if (e) e.stopPropagation();
        if (!document.fullscreenElement) document.documentElement.requestFullscreen?.();
        else document.exitFullscreen?.();
      }, []);

      useEffect(() => {
        const onKey = (e) => {
          if (e.key === "ArrowRight") {
            e.preventDefault();
            nextSlide();
          } else if (e.key === "ArrowLeft") {
            e.preventDefault();
            prevSlide();
          } else if (e.key.toLowerCase() === "f") {
            toggleFullscreen();
          } else if (e.key.toLowerCase() === "g") {
            setShowMap((v) => !v);
          } else if (e.key === "Escape") {
            setShowMap(false);
          }
        };
        window.addEventListener("keydown", onKey);
        return () => window.removeEventListener("keydown", onKey);
      }, [nextSlide, prevSlide, toggleFullscreen]);

      const slide = SLIDES[current];
      const progress = ((current + 1) / total) * 100;

      return (
        <div
          className="relative w-screen h-screen bg-pastel-tech flex flex-col justify-between overflow-hidden cursor-default"
        >
          {/* Subtle Pastel Tech Dot Overlay */}
          <div className="pointer-events-none absolute inset-0 bg-pastel-dots" />

          {/* Floating Pastel Aurora Blobs */}
          <div className="pointer-events-none aurora-blob absolute -top-28 -left-28 w-[420px] h-[420px] rounded-full bg-sky-200/50 blur-[100px]" />
          <div className="pointer-events-none aurora-blob absolute top-1/3 -right-28 w-[380px] h-[380px] rounded-full bg-violet-200/50 blur-[100px]" style={{ animationDelay: "-4s" }} />
          <div className="pointer-events-none aurora-blob absolute -bottom-28 left-1/3 w-[400px] h-[400px] rounded-full bg-emerald-200/45 blur-[100px]" style={{ animationDelay: "-8s" }} />

          {/* Top Progress Bar */}
          <div className="w-full h-1.5 bg-white/60 z-30 shrink-0">
            <div
              className="h-full bg-gradient-to-r from-sky-400 via-violet-400 to-emerald-400 transition-all duration-300 ease-out"
              style={{ width: `${progress}%` }}
            />
          </div>

          {/* Slide Content */}
          <main key={slide.id} className="slide-enter relative z-10 flex-1 w-full max-w-[1400px] mx-auto px-6 md:px-10 py-6 md:py-8 flex flex-col justify-center min-h-0">
            {slide.title ? (
              <div className="flex flex-col h-full justify-center gap-6">
                <header className="shrink-0">
                  <span className="inline-block font-mono text-xs md:text-sm uppercase tracking-widest text-violet-700 font-semibold mb-1.5">
                    {slide.badge}
                  </span>
                  <h2 className="text-3xl md:text-5xl font-extrabold text-slate-900 tracking-tight">
                    {slide.title}
                  </h2>
                  {slide.subtitle && (
                    <p className="text-lg md:text-xl text-slate-600 mt-1.5">{slide.subtitle}</p>
                  )}
                </header>
                <div className="flex-1 flex flex-col justify-center min-h-0">
                  {slide.render()}
                </div>
              </div>
            ) : (
              slide.render()
            )}
          </main>

          {/* Slide Quick-Jump Overlay */}
          {showMap && (
            <div
              onClick={(e) => e.stopPropagation()}
              className="absolute inset-0 z-40 bg-indigo-950/35 backdrop-blur-md flex items-center justify-center p-6"
            >
              <div className="glass-pastel rounded-3xl p-6 max-w-3xl w-full space-y-4">
                <div className="flex items-center justify-between">
                  <h3 className="text-xl font-bold text-slate-900">Ir para o Slide</h3>
                  <button
                    type="button"
                    onClick={() => setShowMap(false)}
                    className="p-2 rounded-lg text-slate-500 hover:text-slate-900 cursor-pointer"
                  >
                    <Icon name="x" className="w-5 h-5" />
                  </button>
                </div>
                <div className="grid grid-cols-2 sm:grid-cols-4 gap-3">
                  {SLIDES.map((s, idx) => (
                    <button
                      key={s.id}
                      type="button"
                      onClick={() => {
                        setCurrent(idx);
                        setShowMap(false);
                      }}
                      className={`p-3 rounded-xl text-left border transition cursor-pointer ${idx === current
                        ? "bg-sky-100 border-sky-400 text-slate-900 shadow-sm"
                        : "bg-white/75 border-slate-200 text-slate-700 hover:border-violet-300"
                        }`}
                    >
                      <div className="text-xs font-mono text-violet-700 font-semibold">Slide {s.id}</div>
                      <div className="text-sm font-semibold truncate mt-0.5">{s.name}</div>
                    </button>
                  ))}
                </div>
              </div>
            </div>
          )}

          {/* Discrete Bottom Bar */}
          <footer
            onClick={(e) => e.stopPropagation()}
            className="relative z-30 w-full max-w-7xl mx-auto px-6 md:px-12 pb-5 pt-2 flex items-center justify-between text-slate-600 shrink-0"
          >
            <div className="flex items-center gap-3 font-mono text-xs md:text-sm">
              <span className="text-sky-700 font-bold">React Native Skia</span>
              <span className="hidden sm:inline text-slate-400">•</span>
              <span className="hidden sm:inline text-slate-500">Setas ← → (Teclado ou Botões) • G (Mapa) • F (Tela cheia)</span>
            </div>

            <div className="flex items-center gap-2">
              <button
                type="button"
                onClick={() => setShowMap((v) => !v)}
                title="Mapa de slides (G)"
                className="p-2 rounded-lg bg-white/80 border border-slate-200 hover:border-violet-400 hover:text-violet-700 transition cursor-pointer shadow-sm"
              >
                <Icon name="grid" className="w-4 h-4" />
              </button>

              <button
                type="button"
                onClick={prevSlide}
                disabled={current === 0}
                aria-label="Slide anterior"
                className="p-2 rounded-lg bg-white/80 border border-slate-200 hover:border-sky-400 hover:text-slate-900 disabled:opacity-35 disabled:pointer-events-none transition cursor-pointer shadow-sm"
              >
                <Icon name="arrowLeft" className="w-4 h-4" />
              </button>

              <span className="px-3 py-1.5 rounded-lg bg-white/80 border border-slate-200 font-mono text-xs md:text-sm text-slate-700 shadow-sm">
                Slide <strong className="text-sky-700">{current + 1}</strong> / {total}
              </span>

              <button
                type="button"
                onClick={nextSlide}
                disabled={current === total - 1}
                aria-label="Próximo slide"
                className="p-2 rounded-lg bg-white/80 border border-slate-200 hover:border-sky-400 hover:text-slate-900 disabled:opacity-35 disabled:pointer-events-none transition cursor-pointer shadow-sm"
              >
                <Icon name="arrowRight" className="w-4 h-4" />
              </button>

              <button
                type="button"
                onClick={toggleFullscreen}
                title="Tela cheia (F)"
                aria-label="Alternar tela cheia"
                className="ml-1 p-2 rounded-lg bg-white/80 border border-slate-200 hover:border-emerald-400 hover:text-emerald-700 transition cursor-pointer shadow-sm"
              >
                <Icon name="maximize" className="w-4 h-4" />
              </button>
            </div>
          </footer>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById("root"));
    root.render(<App />);
  </script>
</body>

</html>
